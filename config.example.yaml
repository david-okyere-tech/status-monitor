# Status Monitor Configuration
# Copy this file to config.yaml and edit as needed.

# URLs to monitor — add as many as you like
urls:
  - https://example.com
  # - https://google.com
  # - https://your-api.com/health

# Seconds between checks
interval: 60

# HTTP request timeout in seconds
timeout: 10

# How many retries before declaring a site DOWN
max_retries: 2

# Expected HTTP status code (200 = OK)
expected_status: 200

# Alerting configuration
alerts:
  # Webhook: POSTs a JSON payload on DOWN/WARNING events
  # webhook: https://hooks.slack.com/services/XXX/YYY/ZZZ

  # Email: sends an alert on DOWN events
  # email:
  #   smtp_host: smtp.gmail.com
  #   smtp_port: 587
  #   sender: yourbot@gmail.com
  #   recipient: you@gmail.com
  #   username: yourbot@gmail.com
  #   password: app-password-here
  #   use_tls: true
