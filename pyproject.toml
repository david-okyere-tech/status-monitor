[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "status-monitor"
version = "5.0.0"
description = "Async uptime monitor with a live terminal dashboard, status page, and alerts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Okyere" }]
keywords = ["uptime", "monitoring", "status-page", "http"]
dependencies = [
    "httpx>=0.27.0",
    "aiosmtplib>=3.0.0",
    "PyYAML>=6.0",
    "rich>=13.7.0",
    "tomli>=2.0.1; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
status-monitor = "status_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/david-okyere-tech/status-monitor"

[tool.setuptools.packages.find]
include = ["status_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
